name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (32-bit + 64-bit)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mytv-android-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MyTV YSP ${{ github.ref_name }}
          body: |
            mytv-android 集成 ysp-live 自动构建产物。

            - `app-armeabi-v7a-debug.apk`：32 位（armeabi-v7a），适用于老电视/部分盒子
            - `app-arm64-v8a-debug.apk`：64 位（arm64-v8a），适用于新电视/手机
            - `app-universal-debug.apk`：通用包，同时含 32/64 位，推荐直接安装

            调试版已签名，可直接侧载安装。
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
