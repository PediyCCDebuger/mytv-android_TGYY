name: Build Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 固定签名：仓库内 .github/signing/release.keystore.b64 保证每次构建用同一把密钥，
      # 老版本可被新版本直接覆盖升级（签名一致）。secrets 若配置则优先级更高。
      - name: Restore fixed signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MYTV_KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.MYTV_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "password=$SECRET_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "alias=mytv" >> "$GITHUB_OUTPUT"
          elif [ -f .github/signing/release.keystore.b64 ]; then
            base64 --decode .github/signing/release.keystore.b64 > "$RUNNER_TEMP/release.jks"
            echo "password=mytv2026" >> "$GITHUB_OUTPUT"
            echo "alias=mytv" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No signing key found"
            exit 1
          fi

      - name: Build signed release APK (32-bit + 64-bit + universal)
        env:
          KEYSTORE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ steps.signing.outputs.password }}
          KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          KEY_PASSWORD: ${{ steps.signing.outputs.password }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk"
            "$apksigner" verify --print-certs "$apk" | grep "SHA-256" | head -1
          done

      - name: Extract release notes from tag annotation
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # 浅克隆中 git tag --format 读不到附注，走 GitHub API：
          # 附注 tag 读 tag.message，轻量 tag 回退读 commit.message
          AUTH="Authorization: Bearer $GH_TOKEN"
          TAG_SHA=$(curl -s -H "$AUTH" "https://api.github.com/repos/$REPO/git/ref/tags/$TAG" | python3 -c "import sys,json;print(json.load(sys.stdin)['object']['sha'])")
          TAG_MSG=$(curl -s -H "$AUTH" "https://api.github.com/repos/$REPO/git/tags/$TAG_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin).get('message','') or '')")
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(curl -s -H "$AUTH" "https://api.github.com/repos/$REPO/commits/$TAG_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin)['commit']['message'])")
          fi
          printf '%s\n' "$TAG_MSG" > release_notes.txt
          cat >> release_notes.txt <<'EOF'

          ---

          **APK 包说明**（均为 release 签名，可直接覆盖升级）
          - `app-universal-release.apk`：通用包（含 32/64 位），推荐
          - `app-arm64-v8a-release.apk`：64 位（新电视/手机）
          - `app-armeabi-v7a-release.apk`：32 位（老电视/盒子）
          EOF

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mytv-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MyTV YSP ${{ github.ref_name }}
          body_path: release_notes.txt
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
