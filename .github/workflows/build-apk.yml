name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners 已预装 Android SDK 于 /usr/local/lib/android/sdk；无需 setup-android（该 action 会尝试安装已废弃的 "tools" 包而失败）
      - name: Set up Android SDK (accept licenses + install platform/build-tools)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (32-bit + 64-bit)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mytv-android-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Extract release notes from tag annotation
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # actions/checkout 的浅克隆中 git tag --format='%(contents)' 读不到附注消息，
          # 因此通过 API 获取：附注 tag 读 tag.message，轻量 tag 回退读 commit.message
          AUTH="Authorization: Bearer $GH_TOKEN"
          TAG_SHA=$(curl -s -H "$AUTH" "https://api.github.com/repos/$REPO/git/ref/tags/$TAG" | python3 -c "import sys,json;print(json.load(sys.stdin)['object']['sha'])")
          TAG_MSG=$(curl -s -H "$AUTH" "https://api.github.com/repos/$REPO/git/tags/$TAG_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin).get('message','') or '')")
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(curl -s -H "$AUTH" "https://api.github.com/repos/$REPO/commits/$TAG_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin)['commit']['message'])")
          fi
          printf '%s\n' "$TAG_MSG" > release_notes.txt
          cat >> release_notes.txt <<'EOF'

          ---

          **APK 包说明**

          - `app-armeabi-v7a-debug.apk`：32 位（armeabi-v7a），适用于老电视/部分盒子
          - `app-arm64-v8a-debug.apk`：64 位（arm64-v8a），适用于新电视/手机
          - `app-universal-debug.apk`：通用包，同时含 32/64 位，推荐直接安装

          调试版已签名，可直接侧载安装。
          EOF

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MyTV YSP ${{ github.ref_name }}
          body_path: release_notes.txt
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
