# 已停用：release 构建与发布统一由 build-apk.yml 负责（固定签名 + 固定密钥）。
#
# 原 release.yml 依赖 secrets.KEYSTORE_BASE64 / GIT_TOKEN 但均未配置，tag 触发必然失败，
# 且会与 build-apk.yml 的 Release 发布流程重复冲突。保留文件仅为历史记录，
# 不设置任何 trigger，故不会运行。如需恢复，请先删除本文件再重新设计。

name: Release (disabled - see build-apk.yml)

on:
  workflow_dispatch:
    # 仅允许手动触发，且手动触发会失败（缺 secrets）；正常 tag push 不触发。
    inputs:
      confirm:
        description: '此工作流已停用，请勿运行'
        required: false
        default: 'disabled'

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: 提示
        run: echo "此工作流已停用。release 构建与发布请使用 build-apk.yml。"
